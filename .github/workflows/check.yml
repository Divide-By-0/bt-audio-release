name: Check
on: [push, pull_request]
jobs:
  policy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n bt-audio-release.sh install.sh uninstall.sh
      - run: swift build -c release --package-path bt-kill-a2dp
